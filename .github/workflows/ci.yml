name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the pinned Jenkins check runtime locally
        run: docker build --file ci/Dockerfile --tag place-check-runtime .
      - name: Run repository checks in the same rendering environment
        env:
          REPORTS: ${{ runner.temp }}/place-check-reports
        run: |
          mkdir -p "$REPORTS"
          docker run --rm --init --read-only --network none \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --cpus 2 --memory 6g --memory-swap 6g --pids-limit 512 --shm-size 256m \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,source=$REPORTS,target=/reports" \
            place-check-runtime /tools/source/ci/actions-check.py
      - name: Retain Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: place-playwright-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/place-check-reports/playwright-report
            ${{ runner.temp }}/place-check-reports/test-results
            ${{ runner.temp }}/place-check-reports/resource-usage.json
          if-no-files-found: warn
          compression-level: 0
          overwrite: false
          retention-days: 14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name != 'pull_request'
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Verify PostgreSQL/PostGIS migrations
        if: github.event_name != 'pull_request'
        env:
          PLACE_DATABASE_TEST_HOST: 127.0.0.1
        run: npm run test:database
      - name: Rehearse backup, isolated restore, and credential rotation
        if: github.event_name != 'pull_request'
        env:
          PLACE_DATABASE_TEST_HOST: 127.0.0.1
        run: npm run test:database-recovery
      - name: Build both release targets from the same source
        if: github.event_name != 'pull_request'
        run: |
          docker build --target web-runtime --tag place-web-ci .
          docker build --target backend-runtime --tag place-backend-ci .
