services:
  web:
    environment:
      PLACE_OIDC_RUNTIME_ENABLED: "true"
      PLACE_MEMBERSHIP_RUNTIME_ENABLED: "true"
      PLACE_DATABASE_URL_FILE: /run/secrets/place_database_url
      PLACE_OIDC_CLIENT_SECRET_FILE: /run/secrets/place_oidc_client_secret
      PLACE_OIDC_ENCRYPTION_KEYRING_FILE: /run/secrets/place_oidc_encryption_keyring
      PLACE_OIDC_ISSUER: ${PLACE_OIDC_ISSUER:?PLACE_OIDC_ISSUER is required}
      PLACE_OIDC_CLIENT_ID: ${PLACE_OIDC_CLIENT_ID:?PLACE_OIDC_CLIENT_ID is required}
      PLACE_OIDC_CALLBACK_URL: ${PLACE_OIDC_CALLBACK_URL:?PLACE_OIDC_CALLBACK_URL is required}
      PLACE_OIDC_POST_LOGIN_PATH: ${PLACE_OIDC_POST_LOGIN_PATH:?PLACE_OIDC_POST_LOGIN_PATH is required}
      PLACE_OIDC_SCOPES: ${PLACE_OIDC_SCOPES:?PLACE_OIDC_SCOPES is required}
      PLACE_OIDC_TRANSACTION_TTL_SECONDS: ${PLACE_OIDC_TRANSACTION_TTL_SECONDS:?PLACE_OIDC_TRANSACTION_TTL_SECONDS is required}
      PLACE_OIDC_SESSION_TTL_SECONDS: ${PLACE_OIDC_SESSION_TTL_SECONDS:?PLACE_OIDC_SESSION_TTL_SECONDS is required}
      PLACE_OIDC_DATABASE_MAX_CONNECTIONS: ${PLACE_OIDC_DATABASE_MAX_CONNECTIONS:?PLACE_OIDC_DATABASE_MAX_CONNECTIONS is required}
      PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_OIDC_CLEANUP_BATCH_SIZE: ${PLACE_OIDC_CLEANUP_BATCH_SIZE:?PLACE_OIDC_CLEANUP_BATCH_SIZE is required}
      PLACE_OIDC_CLEANUP_INTERVAL_SECONDS: ${PLACE_OIDC_CLEANUP_INTERVAL_SECONDS:?PLACE_OIDC_CLEANUP_INTERVAL_SECONDS is required}
      PLACE_BACKEND_ORIGIN: ${PLACE_BACKEND_ORIGIN:?PLACE_BACKEND_ORIGIN is required}
      PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS: ${PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS:?PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS is required}
    secrets:
      - place_database_url
      - place_oidc_client_secret
      - place_oidc_encryption_keyring
    networks:
      - default
      - place-data
    depends_on:
      backend:
        condition: service_healthy

  backend:
    environment:
      PLACE_HTTP_RUNTIME_MODE: production
      PLACE_DATABASE_URL_FILE: /run/secrets/place_database_url
      PLACE_DATABASE_MAX_CONNECTIONS: ${PLACE_DATABASE_MAX_CONNECTIONS:?PLACE_DATABASE_MAX_CONNECTIONS is required}
      PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_MEMBERSHIP_POLICY_FILE: /run/configs/place_membership_policy
      PLACE_AUTH_MODE: oidc
      PLACE_OIDC_ISSUER: ${PLACE_OIDC_ISSUER:?PLACE_OIDC_ISSUER is required}
      PLACE_OIDC_AUDIENCE: ${PLACE_OIDC_AUDIENCE:?PLACE_OIDC_AUDIENCE is required}
      PLACE_OIDC_JWKS_URI: ${PLACE_OIDC_JWKS_URI:?PLACE_OIDC_JWKS_URI is required}
      PLACE_OIDC_REQUIRED_SCOPES: ${PLACE_OIDC_REQUIRED_SCOPES:?PLACE_OIDC_REQUIRED_SCOPES is required}
    secrets:
      - place_database_url
    configs:
      - place_membership_policy
    networks:
      - default
      - place-data

secrets:
  place_database_url:
    file: ${PLACE_DATABASE_URL_FILE:?PLACE_DATABASE_URL_FILE is required}
  place_oidc_client_secret:
    file: ${PLACE_OIDC_CLIENT_SECRET_FILE:?PLACE_OIDC_CLIENT_SECRET_FILE is required}
  place_oidc_encryption_keyring:
    file: ${PLACE_OIDC_ENCRYPTION_KEYRING_FILE:?PLACE_OIDC_ENCRYPTION_KEYRING_FILE is required}

configs:
  place_membership_policy:
    file: ${PLACE_MEMBERSHIP_POLICY_FILE:?PLACE_MEMBERSHIP_POLICY_FILE is required}

networks:
  place-data:
    external: true
    name: ${PLACE_DATA_NETWORK:?PLACE_DATA_NETWORK is required}
