services:
  web:
    environment:
      PLACE_OIDC_RUNTIME_ENABLED: "true"
      PLACE_MEMBERSHIP_RUNTIME_ENABLED: "true"
      PLACE_IMPORT_RUNTIME_ENABLED: "true"
      PLACE_CONNECTOR_RUNTIME_ENABLED: "true"
      PLACE_DATABASE_URL_FILE: /run/secrets/place_database_url
      PLACE_OIDC_CLIENT_SECRET_FILE: /run/secrets/place_oidc_client_secret
      PLACE_OIDC_ENCRYPTION_KEYRING_FILE: /run/secrets/place_oidc_encryption_keyring
      PLACE_OIDC_ISSUER: ${PLACE_OIDC_ISSUER:?PLACE_OIDC_ISSUER is required}
      PLACE_OIDC_CLIENT_ID: ${PLACE_OIDC_CLIENT_ID:?PLACE_OIDC_CLIENT_ID is required}
      PLACE_OIDC_CALLBACK_URL: ${PLACE_OIDC_CALLBACK_URL:?PLACE_OIDC_CALLBACK_URL is required}
      PLACE_OIDC_POST_LOGIN_PATH: ${PLACE_OIDC_POST_LOGIN_PATH:?PLACE_OIDC_POST_LOGIN_PATH is required}
      PLACE_OIDC_SCOPES: ${PLACE_OIDC_SCOPES:?PLACE_OIDC_SCOPES is required}
      PLACE_OIDC_TRANSACTION_TTL_SECONDS: ${PLACE_OIDC_TRANSACTION_TTL_SECONDS:?PLACE_OIDC_TRANSACTION_TTL_SECONDS is required}
      PLACE_OIDC_SESSION_TTL_SECONDS: ${PLACE_OIDC_SESSION_TTL_SECONDS:?PLACE_OIDC_SESSION_TTL_SECONDS is required}
      PLACE_OIDC_DATABASE_MAX_CONNECTIONS: ${PLACE_OIDC_DATABASE_MAX_CONNECTIONS:?PLACE_OIDC_DATABASE_MAX_CONNECTIONS is required}
      PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_OIDC_CLEANUP_BATCH_SIZE: ${PLACE_OIDC_CLEANUP_BATCH_SIZE:?PLACE_OIDC_CLEANUP_BATCH_SIZE is required}
      PLACE_OIDC_CLEANUP_INTERVAL_SECONDS: ${PLACE_OIDC_CLEANUP_INTERVAL_SECONDS:?PLACE_OIDC_CLEANUP_INTERVAL_SECONDS is required}
      PLACE_BACKEND_ORIGIN: ${PLACE_BACKEND_ORIGIN:?PLACE_BACKEND_ORIGIN is required}
      PLACE_CONNECTOR_PUBLIC_ORIGIN: ${PLACE_CONNECTOR_PUBLIC_ORIGIN:?PLACE_CONNECTOR_PUBLIC_ORIGIN is required}
      PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS: ${PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS:?PLACE_MEMBERSHIP_BACKEND_TIMEOUT_MILLISECONDS is required}
      PLACE_IMPORT_BACKEND_TIMEOUT_MILLISECONDS: ${PLACE_IMPORT_BACKEND_TIMEOUT_MILLISECONDS:?PLACE_IMPORT_BACKEND_TIMEOUT_MILLISECONDS is required}
      PLACE_CONNECTOR_BACKEND_TIMEOUT_MILLISECONDS: ${PLACE_CONNECTOR_BACKEND_TIMEOUT_MILLISECONDS:?PLACE_CONNECTOR_BACKEND_TIMEOUT_MILLISECONDS is required}
    secrets:
      - place_database_url
      - place_oidc_client_secret
      - place_oidc_encryption_keyring
    networks:
      - default
      - place-data

  worker-capture-sweep:
    environment:
      PLACE_DATABASE_URL_FILE: /run/secrets/place_database_url
      PLACE_WORKER_DATABASE_MAX_CONNECTIONS: ${PLACE_WORKER_DATABASE_MAX_CONNECTIONS:?PLACE_WORKER_DATABASE_MAX_CONNECTIONS is required}
      PLACE_WORKER_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_WORKER_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_WORKER_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_WORKER_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_WORKER_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_WORKER_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_CAPTURE_ROOT: /var/lib/place/captures
      PLACE_CAPTURE_KEYRING_FILE: /run/secrets/place_capture_keyring
      PLACE_CAPTURE_MAXIMUM_BYTES: ${PLACE_CAPTURE_MAXIMUM_BYTES:?PLACE_CAPTURE_MAXIMUM_BYTES is required}
      PLACE_CAPTURE_SWEEP_BATCH_SIZE: ${PLACE_CAPTURE_SWEEP_BATCH_SIZE:?PLACE_CAPTURE_SWEEP_BATCH_SIZE is required}
    secrets:
      - place_database_url
      - place_capture_keyring
    volumes:
      - place-captures:/var/lib/place/captures
    networks:
      - place-data
    depends_on:
      backend:
        condition: service_healthy

  backend:
    environment:
      PLACE_HTTP_RUNTIME_MODE: production
      PLACE_DATABASE_URL_FILE: /run/secrets/place_database_url
      PLACE_DATABASE_MAX_CONNECTIONS: ${PLACE_DATABASE_MAX_CONNECTIONS:?PLACE_DATABASE_MAX_CONNECTIONS is required}
      PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_MEMBERSHIP_POLICY_FILE: /run/configs/place_membership_policy
      PLACE_AUTH_MODE: oidc
      PLACE_OIDC_ISSUER: ${PLACE_OIDC_ISSUER:?PLACE_OIDC_ISSUER is required}
      PLACE_OIDC_AUDIENCE: ${PLACE_OIDC_AUDIENCE:?PLACE_OIDC_AUDIENCE is required}
      PLACE_OIDC_JWKS_URI: ${PLACE_OIDC_JWKS_URI:?PLACE_OIDC_JWKS_URI is required}
      PLACE_PLATFORM_ACCESS_ENABLED: ${PLACE_PLATFORM_ACCESS_ENABLED:-false}
      PLACE_PLATFORM_ACCESS_ENDPOINT: ${PLACE_PLATFORM_ACCESS_ENDPOINT:-}
      PLACE_PLATFORM_ACCESS_JWKS_URI: ${PLACE_PLATFORM_ACCESS_JWKS_URI:-}
      PLACE_PLATFORM_ACCESS_ASSERTION_ISSUER: ${PLACE_PLATFORM_ACCESS_ASSERTION_ISSUER:-}
      PLACE_PLATFORM_ACCESS_AUDIENCE: ${PLACE_PLATFORM_ACCESS_AUDIENCE:-}
      PLACE_PLATFORM_ACCESS_TIMEOUT_MILLISECONDS: ${PLACE_PLATFORM_ACCESS_TIMEOUT_MILLISECONDS:-3000}
      PLACE_CONNECTOR_RUNTIME_ENABLED: "true"
      PLACE_CONNECTOR_PUBLIC_ORIGIN: ${PLACE_CONNECTOR_PUBLIC_ORIGIN:?PLACE_CONNECTOR_PUBLIC_ORIGIN is required}
      PLACE_CONNECTOR_GRANT_TTL_SECONDS: ${PLACE_CONNECTOR_GRANT_TTL_SECONDS:?PLACE_CONNECTOR_GRANT_TTL_SECONDS is required}
      PLACE_CONNECTOR_CAPTURE_RETENTION_SECONDS: ${PLACE_CONNECTOR_CAPTURE_RETENTION_SECONDS:?PLACE_CONNECTOR_CAPTURE_RETENTION_SECONDS is required}
      PLACE_CONNECTOR_MAXIMUM_ITEMS: ${PLACE_CONNECTOR_MAXIMUM_ITEMS:?PLACE_CONNECTOR_MAXIMUM_ITEMS is required}
      PLACE_CONNECTOR_MAXIMUM_BYTES: ${PLACE_CONNECTOR_MAXIMUM_BYTES:?PLACE_CONNECTOR_MAXIMUM_BYTES is required}
      PLACE_CONNECTOR_MAXIMUM_BATCHES: ${PLACE_CONNECTOR_MAXIMUM_BATCHES:?PLACE_CONNECTOR_MAXIMUM_BATCHES is required}
      PLACE_CONNECTOR_MAXIMUM_BATCH_BYTES: ${PLACE_CONNECTOR_MAXIMUM_BATCH_BYTES:?PLACE_CONNECTOR_MAXIMUM_BATCH_BYTES is required}
      PLACE_CAPTURE_ROOT: /var/lib/place/captures
      PLACE_CAPTURE_KEYRING_FILE: /run/secrets/place_capture_keyring
      PLACE_CAPTURE_MAXIMUM_BYTES: ${PLACE_CAPTURE_MAXIMUM_BYTES:?PLACE_CAPTURE_MAXIMUM_BYTES is required}
    secrets:
      - place_database_url
      - place_capture_keyring
    volumes:
      - place-captures:/var/lib/place/captures
    configs:
      - source: place_membership_policy
        target: /run/configs/place_membership_policy
    networks:
      - default
      - place-data

secrets:
  place_database_url:
    file: ${PLACE_DATABASE_URL_FILE:?PLACE_DATABASE_URL_FILE is required}
  place_oidc_client_secret:
    file: ${PLACE_OIDC_CLIENT_SECRET_FILE:?PLACE_OIDC_CLIENT_SECRET_FILE is required}
  place_oidc_encryption_keyring:
    file: ${PLACE_OIDC_ENCRYPTION_KEYRING_FILE:?PLACE_OIDC_ENCRYPTION_KEYRING_FILE is required}
  place_capture_keyring:
    file: ${PLACE_CAPTURE_KEYRING_FILE:?PLACE_CAPTURE_KEYRING_FILE is required}

configs:
  place_membership_policy:
    file: ${PLACE_MEMBERSHIP_POLICY_FILE:?PLACE_MEMBERSHIP_POLICY_FILE is required}

networks:
  place-data:
    external: true
    name: ${PLACE_DATA_NETWORK:?PLACE_DATA_NETWORK is required}

volumes:
  place-captures:
    external: true
    name: ${PLACE_CAPTURE_VOLUME:?PLACE_CAPTURE_VOLUME is required}
