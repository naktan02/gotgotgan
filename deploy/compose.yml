name: place

services:
  web:
    image: ${PLACE_WEB_IMAGE:?PLACE_WEB_IMAGE is required}
    environment:
      HOSTNAME: ${PLACE_WEB_HOST:?PLACE_WEB_HOST is required}
      PORT: ${PLACE_WEB_PORT:?PLACE_WEB_PORT is required}
      PLACE_FAMILY_NAVIGATION_MANIFEST: ${PLACE_FAMILY_NAVIGATION_MANIFEST:-}
      PLACE_MAP_STYLE_URL: ${PLACE_MAP_STYLE_URL:-}
      PLACE_OIDC_RUNTIME_ENABLED: ${PLACE_OIDC_RUNTIME_ENABLED:-false}
      PLACE_MEMBERSHIP_RUNTIME_ENABLED: ${PLACE_MEMBERSHIP_RUNTIME_ENABLED:-false}
      PLACE_IMPORT_RUNTIME_ENABLED: ${PLACE_IMPORT_RUNTIME_ENABLED:-false}
      PLACE_CONNECTOR_RUNTIME_ENABLED: ${PLACE_CONNECTOR_RUNTIME_ENABLED:-false}
    expose:
      - "${PLACE_WEB_PORT:?PLACE_WEB_PORT is required}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  admin-web:
    profiles: [admin]
    image: ${PLACE_ADMIN_WEB_IMAGE:?PLACE_ADMIN_WEB_IMAGE is required}
    environment:
      HOSTNAME: ${PLACE_ADMIN_WEB_HOST:?PLACE_ADMIN_WEB_HOST is required}
      PORT: ${PLACE_ADMIN_WEB_PORT:?PLACE_ADMIN_WEB_PORT is required}
      PLACE_ADMIN_OIDC_RUNTIME_ENABLED: ${PLACE_ADMIN_OIDC_RUNTIME_ENABLED:-false}
    expose:
      - "${PLACE_ADMIN_WEB_PORT:?PLACE_ADMIN_WEB_PORT is required}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ${PLACE_BACKEND_IMAGE:?PLACE_BACKEND_IMAGE is required}
    environment:
      PLACE_HTTP_HOST: ${PLACE_HTTP_HOST:?PLACE_HTTP_HOST is required}
      PLACE_HTTP_PORT: ${PLACE_HTTP_PORT:?PLACE_HTTP_PORT is required}
      PLACE_HTTP_RUNTIME_MODE: ${PLACE_HTTP_RUNTIME_MODE:-source-only}
      PLACE_CONNECTOR_RUNTIME_ENABLED: ${PLACE_CONNECTOR_RUNTIME_ENABLED:-false}
      PLACE_PLATFORM_ACCESS_ENABLED: ${PLACE_PLATFORM_ACCESS_ENABLED:-false}
    expose:
      - "${PLACE_HTTP_PORT:?PLACE_HTTP_PORT is required}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PLACE_HTTP_PORT+'/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker-check:
    profiles: [verification]
    image: ${PLACE_BACKEND_IMAGE:?PLACE_BACKEND_IMAGE is required}
    command: ["node", "backend/dist/entrypoints/worker/main.js", "--check"]
    restart: "no"

  worker-capture-sweep:
    profiles: [maintenance]
    image: ${PLACE_BACKEND_IMAGE:?PLACE_BACKEND_IMAGE is required}
    command: ["node", "backend/dist/entrypoints/worker/main.js", "--sweep-expired-captures"]
    restart: "no"

  worker-import-materialization:
    image: ${PLACE_BACKEND_IMAGE:?PLACE_BACKEND_IMAGE is required}
    command: ["node", "backend/dist/entrypoints/worker/main.js", "--run-import-materialization"]
    restart: unless-stopped

  worker-transfer-materialization:
    image: ${PLACE_BACKEND_IMAGE:?PLACE_BACKEND_IMAGE is required}
    command: ["node", "backend/dist/entrypoints/transfer-materialization-main.js"]
    restart: unless-stopped
