services:
  admin-web:
    environment:
      PLACE_ADMIN_OIDC_RUNTIME_ENABLED: "true"
      PLACE_ADMIN_DATABASE_URL_FILE: /run/secrets/place_admin_database_url
      PLACE_ADMIN_OIDC_CLIENT_SECRET_FILE: /run/secrets/place_admin_oidc_client_secret
      PLACE_ADMIN_OIDC_ENCRYPTION_KEYRING_FILE: /run/secrets/place_admin_oidc_encryption_keyring
      PLACE_ADMIN_OIDC_ISSUER: ${PLACE_ADMIN_OIDC_ISSUER:?PLACE_ADMIN_OIDC_ISSUER is required}
      PLACE_ADMIN_OIDC_CLIENT_ID: ${PLACE_ADMIN_OIDC_CLIENT_ID:?PLACE_ADMIN_OIDC_CLIENT_ID is required}
      PLACE_ADMIN_OIDC_CALLBACK_URL: ${PLACE_ADMIN_OIDC_CALLBACK_URL:?PLACE_ADMIN_OIDC_CALLBACK_URL is required}
      PLACE_ADMIN_OIDC_POST_LOGIN_PATH: ${PLACE_ADMIN_OIDC_POST_LOGIN_PATH:?PLACE_ADMIN_OIDC_POST_LOGIN_PATH is required}
      PLACE_ADMIN_OIDC_SCOPES: ${PLACE_ADMIN_OIDC_SCOPES:?PLACE_ADMIN_OIDC_SCOPES is required}
      PLACE_ADMIN_OIDC_TRANSACTION_TTL_SECONDS: ${PLACE_ADMIN_OIDC_TRANSACTION_TTL_SECONDS:?PLACE_ADMIN_OIDC_TRANSACTION_TTL_SECONDS is required}
      PLACE_ADMIN_OIDC_SESSION_TTL_SECONDS: ${PLACE_ADMIN_OIDC_SESSION_TTL_SECONDS:?PLACE_ADMIN_OIDC_SESSION_TTL_SECONDS is required}
      PLACE_ADMIN_OIDC_DATABASE_MAX_CONNECTIONS: ${PLACE_ADMIN_OIDC_DATABASE_MAX_CONNECTIONS:?PLACE_ADMIN_OIDC_DATABASE_MAX_CONNECTIONS is required}
      PLACE_ADMIN_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS: ${PLACE_ADMIN_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS:?PLACE_ADMIN_OIDC_DATABASE_IDLE_TIMEOUT_MILLISECONDS is required}
      PLACE_ADMIN_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS: ${PLACE_ADMIN_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS:?PLACE_ADMIN_OIDC_DATABASE_CONNECTION_TIMEOUT_MILLISECONDS is required}
      PLACE_ADMIN_OIDC_STARTUP_RETRY_ATTEMPTS: ${PLACE_ADMIN_OIDC_STARTUP_RETRY_ATTEMPTS:?PLACE_ADMIN_OIDC_STARTUP_RETRY_ATTEMPTS is required}
      PLACE_ADMIN_OIDC_STARTUP_RETRY_DELAY_MILLISECONDS: ${PLACE_ADMIN_OIDC_STARTUP_RETRY_DELAY_MILLISECONDS:?PLACE_ADMIN_OIDC_STARTUP_RETRY_DELAY_MILLISECONDS is required}
      PLACE_ADMIN_OIDC_CLEANUP_BATCH_SIZE: ${PLACE_ADMIN_OIDC_CLEANUP_BATCH_SIZE:?PLACE_ADMIN_OIDC_CLEANUP_BATCH_SIZE is required}
      PLACE_ADMIN_OIDC_CLEANUP_INTERVAL_SECONDS: ${PLACE_ADMIN_OIDC_CLEANUP_INTERVAL_SECONDS:?PLACE_ADMIN_OIDC_CLEANUP_INTERVAL_SECONDS is required}
      PLACE_BACKEND_ORIGIN: ${PLACE_BACKEND_ORIGIN:?PLACE_BACKEND_ORIGIN is required}
      PLACE_ADMIN_BACKEND_TIMEOUT_MILLISECONDS: ${PLACE_ADMIN_BACKEND_TIMEOUT_MILLISECONDS:?PLACE_ADMIN_BACKEND_TIMEOUT_MILLISECONDS is required}
    secrets:
      - place_admin_database_url
      - place_admin_oidc_client_secret
      - place_admin_oidc_encryption_keyring
    networks:
      - default
      - place-data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

secrets:
  place_admin_database_url:
    file: ${PLACE_ADMIN_DATABASE_URL_FILE:?PLACE_ADMIN_DATABASE_URL_FILE is required}
  place_admin_oidc_client_secret:
    file: ${PLACE_ADMIN_OIDC_CLIENT_SECRET_FILE:?PLACE_ADMIN_OIDC_CLIENT_SECRET_FILE is required}
  place_admin_oidc_encryption_keyring:
    file: ${PLACE_ADMIN_OIDC_ENCRYPTION_KEYRING_FILE:?PLACE_ADMIN_OIDC_ENCRYPTION_KEYRING_FILE is required}
